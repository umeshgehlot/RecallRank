[project]
name = "recsys-serving"
version = "0.1.0"
description = "gRPC serving layer with ONNX Runtime inference"
requires-python = ">=3.11"
authors = [{name = "Tanay Sood"}]
license = {text = "MIT"}
dependencies = [
    "recsys-common",
    "recsys-retrieval",
    "recsys-ranking",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",
    "onnxruntime>=1.17",
    "numpy>=1.24",
]

[tool.uv.sources]
recsys-common = { workspace = true }
recsys-retrieval = { workspace = true }
recsys-ranking = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_serving"]
