[project]
name = "recsys-common"
version = "0.1.0"
description = "Shared schemas, transforms, and feature processing for the recsys pipeline"
requires-python = ">=3.11"
authors = [{name = "Tanay Sood"}]
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_common"]
