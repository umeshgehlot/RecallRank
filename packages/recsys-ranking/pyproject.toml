[project]
name = "recsys-ranking"
version = "0.1.0"
description = "MMoE-DeepFM multi-task ranking model"
requires-python = ">=3.11"
authors = [{name = "Tanay Sood"}]
license = {text = "MIT"}
dependencies = [
    "recsys-common",
    "torch>=2.2",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "pyarrow>=15.0",
]

[tool.uv.sources]
recsys-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys_ranking"]
